<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <pattern id="grid-paper" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e4decb" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background: aged blueprint / investigation schematic paper -->
  <rect width="600" height="360" fill="#fcf9f2" stroke="#222" stroke-width="2"/>
  <rect width="600" height="360" fill="url(#grid-paper)"/>

  <!-- Border & Header -->
  <rect x="15" y="15" width="570" height="330" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="35" fill="#24211e"/>
  <text x="30" y="42" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#fff">EXHIBIT A: ALDER CREEK MILL CRIME SCENE SURVEY</text>
  <text x="565" y="42" font-family="'Courier New', monospace" font-size="11" fill="#e89898" text-anchor="end">POLICE REF: #26-0819-B</text>

  <!-- Alder Creek Water Flow (Wavy river channel) -->
  <path d="M 0 160 C 140 180, 220 140, 340 150 C 440 160, 520 200, 600 190 L 600 280 C 500 290, 420 250, 320 240 C 200 230, 120 270, 0 260 Z" fill="#dce6e5" stroke="#779997" stroke-width="1.5"/>
  <text x="80" y="215" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#587977" letter-spacing="3">ALDER CREEK (RAPID CURRENT &gt;&gt;)</text>
  
  <!-- Current Arrows -->
  <path d="M 170 210 L 210 210 M 200 205 L 210 210 L 200 215" stroke="#587977" stroke-width="1.5" fill="none"/>
  <path d="M 430 220 L 470 220 M 460 215 L 470 220 L 460 225" stroke="#587977" stroke-width="1.5" fill="none"/>

  <!-- Old Alder Mill Footprint (Abandoned 1912 Timber Mill) -->
  <rect x="220" y="70" width="160" height="80" fill="#ede5d3" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="105" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">OLD ALDER MILL</text>
  <text x="300" y="120" font-family="'Courier New', monospace" font-size="9" fill="#666" text-anchor="middle">(DISUSED TIMBER WORKS)</text>

  <!-- Sluice Gate / Sluice Weir -->
  <rect x="290" y="145" width="22" height="98" fill="#5a5247" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="290" y1="165" x2="312" y2="165" stroke="#fff" stroke-width="1"/>
  <line x1="290" y1="185" x2="312" y2="185" stroke="#fff" stroke-width="1"/>
  <line x1="290" y1="205" x2="312" y2="205" stroke="#fff" stroke-width="1"/>
  <line x1="290" y1="225" x2="312" y2="225" stroke="#fff" stroke-width="1"/>

  <!-- Crime Scene Markers -->
  <!-- Marker 1: Body Location -->
  <circle cx="325" cy="180" r="10" fill="#8b1e1e" stroke="#fff" stroke-width="2"/>
  <text x="325" y="184" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <line x1="335" y1="180" x2="430" y2="135" stroke="#8b1e1e" stroke-width="1.2" stroke-dasharray="3,2"/>
  <rect x="430" y="115" width="145" height="36" fill="#fffbf5" stroke="#8b1e1e" stroke-width="1"/>
  <text x="436" y="128" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#8b1e1e">[1] VICTIM RECOVERED</text>
  <text x="436" y="141" font-family="Georgia, serif" font-size="8.5" fill="#333">Arthur Pendelton (04:15 AM)</text>

  <!-- Marker 2: Severed Winch Cable -->
  <circle cx="280" cy="150" r="10" fill="#8b1e1e" stroke="#fff" stroke-width="2"/>
  <text x="280" y="154" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <line x1="270" y1="150" x2="140" y2="110" stroke="#8b1e1e" stroke-width="1.2" stroke-dasharray="3,2"/>
  <rect x="40" y="90" width="150" height="36" fill="#fffbf5" stroke="#8b1e1e" stroke-width="1"/>
  <text x="46" y="103" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#8b1e1e">[2] CUT WINCH CABLE</text>
  <text x="46" y="116" font-family="Georgia, serif" font-size="8.5" fill="#333">Industrial shear cuts found</text>

  <!-- Marker 3: Tire tracks on gravel lane -->
  <!-- Dirt Access Road -->
  <path d="M 40 330 C 120 310, 180 320, 260 290 C 300 275, 330 265, 360 265" stroke="#bbb" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M 40 330 C 120 310, 180 320, 260 290 C 300 275, 330 265, 360 265" stroke="#8d8474" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  
  <circle cx="210" cy="305" r="10" fill="#8b1e1e" stroke="#fff" stroke-width="2"/>
  <text x="210" y="309" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <line x1="210" y1="315" x2="230" y2="335" stroke="#8b1e1e" stroke-width="1"/>
  <rect x="235" y="318" width="170" height="25" fill="#fffbf5" stroke="#8b1e1e" stroke-width="1"/>
  <text x="240" y="334" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#8b1e1e">[3] DUAL-TIRE TRACTOR IMPRINTS</text>

  <!-- Marker 4: Dropped spectacles & matchbook -->
  <circle cx="360" cy="160" r="10" fill="#8b1e1e" stroke="#fff" stroke-width="2"/>
  <text x="360" y="164" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <line x1="370" y1="160" x2="440" y2="175" stroke="#8b1e1e" stroke-width="1.2" stroke-dasharray="3,2"/>
  <rect x="440" y="165" width="140" height="34" fill="#fffbf5" stroke="#8b1e1e" stroke-width="1"/>
  <text x="445" y="177" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#8b1e1e">[4] EVIDENCE DISCOVERED</text>
  <text x="445" y="190" font-family="Georgia, serif" font-size="8" fill="#333">Cracked gold glasses, matchbook</text>

  <!-- Compass Rose -->
  <g transform="translate(530, 280)">
    <circle cx="0" cy="0" r="18" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
    <polygon points="0,-16 4,0 0,4 -4,0" fill="#8b1e1e"/>
    <polygon points="0,16 4,0 0,-4 -4,0" fill="#555"/>
    <text x="0" y="-19" font-family="'Courier New', monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#8b1e1e">N</text>
  </g>

  <!-- Red Confidential Stamp -->
  <g transform="translate(70, 240) rotate(-12)">
    <rect x="0" y="0" width="130" height="30" fill="none" stroke="#8b1e1e" stroke-width="2" rx="3" opacity="0.85"/>
    <text x="65" y="20" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" fill="#8b1e1e" letter-spacing="2" text-anchor="middle" opacity="0.85">PRESS EVIDENCE</text>
  </g>
</svg>
