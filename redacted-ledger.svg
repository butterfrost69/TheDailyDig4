<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" result="noise" numOctaves="3"/>
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Document Sheet -->
  <rect x="10" y="10" width="580" height="400" fill="#f5eedc" stroke="#cfc3ab" stroke-width="1.5" rx="2" filter="url(#paper-texture)"/>
  
  <!-- Subtle aged fold creases -->
  <line x1="10" y1="140" x2="590" y2="140" stroke="#dfd6c0" stroke-width="1.5"/>
  <line x1="10" y1="280" x2="590" y2="280" stroke="#dfd6c0" stroke-width="1.5"/>
  <line x1="300" y1="10" x2="300" y2="410" stroke="#dfd6c0" stroke-width="1.5"/>

  <!-- Official County Header -->
  <text x="300" y="48" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#2d2926" letter-spacing="1.5" text-anchor="middle">BLACKWOOD COUNTY HALL OF RECORDS</text>
  <text x="300" y="65" font-family="'Courier New', monospace" font-size="10" fill="#665f55" letter-spacing="2" text-anchor="middle">SUB-VAULT ACCESS &amp; TITLE TRANSFER LOG - OCTOBER 19</text>
  <line x1="50" y1="74" x2="550" y2="74" stroke="#443e37" stroke-width="1.5"/>
  <line x1="50" y1="77" x2="550" y2="77" stroke="#443e37" stroke-width="0.7"/>

  <!-- Table Headers -->
  <text x="60" y="98" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#1a1a1a">TIME</text>
  <text x="120" y="98" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#1a1a1a">OFFICER / VISITOR</text>
  <text x="280" y="98" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#1a1a1a">FOLIO / PARCEL REF</text>
  <text x="440" y="98" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#1a1a1a">SIGNATURE</text>
  <line x1="50" y1="105" x2="550" y2="105" stroke="#776e62" stroke-width="1"/>

  <!-- Row 1: Normal entry -->
  <text x="60" y="128" font-family="'Courier New', monospace" font-size="9" fill="#333">09:15 AM</text>
  <text x="120" y="128" font-family="'Courier New', monospace" font-size="9" fill="#333">Arthur Pendelton (Archivist)</text>
  <text x="280" y="128" font-family="'Courier New', monospace" font-size="9" fill="#333">Routine Vault Inspection</text>
  <path d="M 440 126 Q 470 120 510 128 Q 480 134 450 130" stroke="#1f2b4d" stroke-width="1.2" fill="none"/>

  <!-- Row 2: Normal entry -->
  <text x="60" y="162" font-family="'Courier New', monospace" font-size="9" fill="#333">11:40 AM</text>
  <text x="120" y="162" font-family="'Courier New', monospace" font-size="9" fill="#333">Clerk G. Miller</text>
  <text x="280" y="162" font-family="'Courier New', monospace" font-size="9" fill="#333">Tax Deed 1988-B (River Rd)</text>
  <path d="M 440 160 Q 460 156 500 162" stroke="#1f2b4d" stroke-width="1.2" fill="none"/>

  <!-- Row 3: SUSPICIOUS & REDACTED ENTRY -->
  <text x="60" y="202" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#8b1e1e">08:24 PM</text>
  <!-- Redacted visitor name -->
  <rect x="118" y="190" width="145" height="16" fill="#1a1a1a" rx="1"/>
  <!-- Redacted parcel code -->
  <rect x="278" y="190" width="150" height="16" fill="#1a1a1a" rx="1"/>
  <text x="282" y="202" font-family="'Courier New', monospace" font-size="8.5" fill="#e0e0e0" opacity="0.3">FOLIO #74-ALDER-M</text>
  <!-- Slashed / torn signature -->
  <path d="M 440 200 L 490 195 L 470 204 L 520 192" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>

  <!-- Row 4: Midnight Vault Alarm log -->
  <text x="60" y="244" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#8b1e1e">11:58 PM</text>
  <text x="120" y="244" font-family="'Courier New', monospace" font-size="9" fill="#333">[SYSTEM ALARM TRIGGER: VAULT 3-C]</text>
  <text x="280" y="244" font-family="'Courier New', monospace" font-size="9" fill="#333">Overridden by Keycard #04</text>
  <text x="440" y="244" font-family="'Courier New', monospace" font-size="8.5" font-style="italic" fill="#666">[KEYCARD: CHIEF CROSS]</text>

  <!-- Row 5: Morning report of missing book -->
  <text x="60" y="286" font-family="'Courier New', monospace" font-size="9" fill="#8b1e1e">07:05 AM</text>
  <text x="120" y="286" font-family="'Courier New', monospace" font-size="9" fill="#8b1e1e">Dep. R. Harris</text>
  <text x="280" y="286" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#8b1e1e">MISSING: 1924 DEED BOOK #8</text>
  <text x="440" y="286" font-family="'Courier New', monospace" font-size="8.5" fill="#333">R. Harris #12</text>

  <!-- Horizontal divider lines -->
  <line x1="50" y1="140" x2="550" y2="140" stroke="#dfd6c0" stroke-width="0.8"/>
  <line x1="50" y1="175" x2="550" y2="175" stroke="#dfd6c0" stroke-width="0.8"/>
  <line x1="50" y1="218" x2="550" y2="218" stroke="#dfd6c0" stroke-width="0.8"/>
  <line x1="50" y1="260" x2="550" y2="260" stroke="#dfd6c0" stroke-width="0.8"/>

  <!-- Hand-written investigative note pinned with paperclip -->
  <g transform="translate(180, 290) rotate(2)">
    <rect x="0" y="0" width="360" height="95" fill="#fffae6" stroke="#c4b897" stroke-width="1" rx="2"/>
    <!-- Red clip line -->
    <rect x="20" y="-8" width="12" height="24" fill="none" stroke="#666" stroke-width="2" rx="3"/>
    <text x="18" y="22" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#8b1e1e">DIGNAN'S FIELD SCRATCHPAD NOTE:</text>
    <text x="18" y="40" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#222">"Who authorized access at 8:24 PM? The pen ink matches the</text>
    <text x="18" y="56" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#222">fountain pen Mayor Vance used at the Rotary lunch. And why was</text>
    <text x="18" y="72" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#222">Cross's keycard logged at midnight when he claimed he was in Dover?"</text>
  </g>

  <!-- Red Rubber Stamp -->
  <g transform="translate(390, 80) rotate(-14)">
    <rect x="0" y="0" width="165" height="42" fill="none" stroke="#9e1b1b" stroke-width="3" rx="4" opacity="0.88"/>
    <rect x="4" y="4" width="157" height="34" fill="none" stroke="#9e1b1b" stroke-width="1" opacity="0.88"/>
    <text x="82" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" fill="#9e1b1b" letter-spacing="1.5" text-anchor="middle" opacity="0.88">CONFIDENTIAL</text>
    <text x="82" y="34" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold" fill="#9e1b1b" letter-spacing="1" text-anchor="middle" opacity="0.88">EXHIBIT #4 - LEAKED FILE</text>
  </g>
</svg>
